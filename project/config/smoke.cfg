# Tiny grid for tests and fast iteration — runs in seconds.
# Same market/model as reference.cfg, only discretisation shrunk.
# nt kept high relative to grid: explicit stability needs dt small even here.

option.strike         = 5250.0
option.maturity_years = 0.25
option.type           = call

market.spot      = 5200.0
market.rate      = 0.045
market.div_yield = 0.013

heston.v0    = 0.04
heston.kappa = 1.5
heston.theta = 0.04
heston.xi    = 0.35
heston.rho   = -0.70

grid.ns         = 256
grid.nv         = 64
grid.nt         = 20000
grid.s_max_mult = 4.0
grid.v_max      = 1.0
