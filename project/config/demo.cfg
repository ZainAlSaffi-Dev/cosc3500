# Animation/demo configuration (PLAN P6). Same market and same model as
# reference.cfg — ONLY the discretisation differs. Nothing here is tuned to
# flatter the picture; the grid is simply put where the model actually goes.
#
# Three deliberate choices, each measured (numbers from this Mac, -O2):
#
# 1. v_max = 0.2 instead of 1.0. Variance starts at v0 = 0.04 and is pulled
#    back to theta = 0.04; its exact CIR standard deviation at T = 0.25y is
#    0.0294, so v = 0.2 is 5.4 sigma away and v = 1.0 is unreachable fantasy.
#    Cost of the truncation, measured at ns=421 with dv held at 0.002:
#      v_max = 0.4  ->  195.8869
#      v_max = 0.2  ->  195.8876      (a 0.0004% difference)
#    Two-thirds of the old frame — and two-thirds of the old flops — were
#    spent on variance levels the market cannot reach.
#
# 2. ns = 526, nv = 101 put the quoted point exactly ON a node:
#      spot 5200 = node 130 of 525 spanning [0, 21000]
#      v0   0.04 = node  20 of 100 spanning [0, 0.2]
#    Off-node grids read the price one half-cell away and pay an O(ds) error
#    of delta*offset — about +11 dollars on a 512-node grid. This is the same
#    node-alignment rule the P4 convergence ladder uses.
#
# 3. dt = 0.25/24000 = 1.042e-5 against a stability bound of 1.633e-5
#    (ratio 0.64 — inside the margin, and P5 measured the true cliff at
#    ~1.09x the printed bound).
#
# Result: 196.105 in 2.84 s, against the P4 Richardson estimate of ~196.16.
# The P4 ladder needed 421x101x56000 and 4.92 s to reach 195.925. Putting the
# nodes where the physics is beats spending more of them.
#
# Filming it (see scripts/weather_map.py; --zoom crops to the reachable box):
#   ./heston --config config/demo.cfg --dump-every 60 --dump-dir results/demo
#   python3 scripts/weather_map.py results/demo --time-value --zoom \
#       --gamma 0.5 --warp sqrt --envelope --price-trace \
#       --s-max-mult 4.0 --v-max 0.2 --out results/demo.mp4

option.strike         = 5250.0
option.maturity_years = 0.25
option.type           = call

market.spot      = 5200.0
market.rate      = 0.045
market.div_yield = 0.013

heston.v0    = 0.04
heston.kappa = 1.5
heston.theta = 0.04
heston.xi    = 0.35
heston.rho   = -0.70

grid.ns         = 526
grid.nv         = 101
grid.nt         = 24000
grid.s_max_mult = 4.0
grid.v_max      = 0.2
