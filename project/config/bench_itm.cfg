# Throughput benchmark configuration, deep-in-the-money readout. TIMING ONLY.
#
# Identical to config/bench.cfg in every way that touches the measurement:
# same strike, so same s_max = 4 x 5250 (grid.cpp derives s_max from the
# STRIKE, not the spot), same grid geometry, same stencil, same stability
# arithmetic. The ONLY change is market.spot, which is nothing but the point
# where the answer is read off the finished grid.
#
# Why it exists: sweep B's largest grid (4096 x 1024) needs maturity 6.4e-6
# years to stay stable at nt = 100, and at that maturity a call struck $50
# out of the money is a ~19-sigma event — the readout underflows to ~2e-16.
# A price that is numerically zero still forces the compiler to do the work
# (it is printed), but it is a weak witness: a broken kernel could print the
# same nothing. Reading out deep in the money instead gives a price near
# intrinsic value, about $5,150 — a number with digits in it, which baseline
# and opt must reproduce identically for the row to mean anything.
#
# Used only where the standard readout underflows (the 4096 x 1024 row of
# slurm/bench_scaling.sh). Every other row keeps config/bench.cfg so its
# numbers stay comparable with the published sweeps.

option.strike         = 5250.0
option.maturity_years = 0.00051
option.type           = call

market.spot      = 10400.0
market.rate      = 0.045
market.div_yield = 0.013

heston.v0    = 0.04
heston.kappa = 1.5
heston.theta = 0.04
heston.xi    = 0.35
heston.rho   = -0.70

grid.ns         = 2048
grid.nv         = 512
grid.nt         = 2000
grid.s_max_mult = 4.0
grid.v_max      = 0.64
