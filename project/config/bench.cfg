# Throughput benchmark configuration (PLAN P7 / §6). TIMING ONLY.
#
# READ THIS FIRST: this config does NOT price a real contract. The maturity
# below is about four and a half hours, not three months, so the number in the
# price column is an option that barely exists. What this config measures is
# CELL-UPDATES PER SECOND — how fast the kernel pushes the grid — and for that
# the only things that matter are the memory footprint and the access pattern,
# both of which are byte-for-byte identical to config/reference.cfg.
#
# The real price comes from config/reference.cfg; that it is CORRECT is proved
# by P3 (Black-Scholes collapse, put-call parity) and P4 (convergence).
#
# Why a separate config at all: reference.cfg needs nt = 980000 to stay stable
# over a 0.25-year maturity, which is ~40 minutes per solve. Five reps x nine
# ladder rungs at that runtime is thirty hours of compute node for numbers that
# are pure throughput. Shrinking the MATURITY instead of the grid keeps the
# identical 2048 x 512 footprint (two 8 MB buffers, still far larger than any
# per-core cache) and the identical nine-point stencil traversal, while
# nt = 2000 brings a rep down to ~4.7 s.
#
# Stability, same arithmetic as reference.cfg (the bound depends on the GRID,
# not on the maturity — which is exactly why shrinking the maturity is the
# safe knob to turn here):
#     dt_stable = 3.661e-7
#     dt        = 0.00051 / 2000 = 2.550e-7
#     ratio                      = 0.697
# So the scheme is stable here too — no nan, and the price column is consumed
# and printed, which PLAN §6 requires so the compiler cannot delete the loop.

option.strike         = 5250.0
option.maturity_years = 0.00051
option.type           = call

market.spot      = 5200.0
market.rate      = 0.045
market.div_yield = 0.013

heston.v0    = 0.04
heston.kappa = 1.5
heston.theta = 0.04
heston.xi    = 0.35
heston.rho   = -0.70

grid.ns         = 2048
grid.nv         = 512
grid.nt         = 2000
grid.s_max_mult = 4.0
grid.v_max      = 0.64
