# Instability horror show (PLAN P5): smoke-sized grid at ~4x the stable
# timestep. dt = 0.25/4096 = 6.10e-5 vs the printed bound ~1.526e-5 for this
# grid — the checkerboard erupts at the high-S/high-v corner within the
# first few hundred steps and overflows to NaN. Run with --dump-every 8 and
# weather_map.py --diverging to film it.
# Smoke-sized (not reference-sized) so snapshot dumps stay filmable:
# a 2048x512 frame is ~13 MB of CSV; 256x64 is ~200 KB.
# Measured boundary vs printed estimate: see STUDY_GUIDE §10b (P5 notes).

option.strike         = 5250.0
option.maturity_years = 0.25
option.type           = call

market.spot      = 5200.0
market.rate      = 0.045
market.div_yield = 0.013

heston.v0    = 0.04
heston.kappa = 1.5
heston.theta = 0.04
heston.xi    = 0.35
heston.rho   = -0.70

grid.ns         = 256
grid.nv         = 64
grid.nt         = 4096
grid.s_max_mult = 4.0
grid.v_max      = 1.0
