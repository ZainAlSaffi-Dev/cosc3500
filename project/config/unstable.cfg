# Instability horror show (PLAN P5): reference grid at ~4x the stable
# timestep — nt cut so dt exceeds the explicit stability bound. Run with
# --dump-every to film the checkerboard blow-up. Exact nt for "4x" gets
# tuned once the solver prints its dt_stable_estimate.

option.strike         = 5250.0
option.maturity_years = 0.25
option.type           = call

market.spot      = 5200.0
market.rate      = 0.045
market.div_yield = 0.013

heston.v0    = 0.04
heston.kappa = 1.5
heston.theta = 0.04
heston.xi    = 0.35
heston.rho   = -0.70

grid.ns         = 2048
grid.nv         = 512
grid.nt         = 500
grid.s_max_mult = 4.0
grid.v_max      = 1.0
