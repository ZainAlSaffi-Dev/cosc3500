# Reference configuration — spec §8. Every benchmark and validation quotes this.
# SPX call, three months out.
#
# TWO DELIBERATE DEVIATIONS from InitialSpecDesign.md §8, both pre-authorised
# by PLAN §7 ("Solver prints stability estimate; adjust nt or shrink v_max").
#
# --- 1. grid.nt 2000 -> 980000 ---------------------------------------------
# At nt = 2000 this config printed nan,nan,nan,nan. It was 527x over the
# explicit stability limit and the scheme did exactly what P5 films it doing.
# An explicit scheme on a 2048 x 512 grid simply costs this many steps.
#
# --- 2. grid.v_max 1.0 -> 0.64 ---------------------------------------------
# v_max is the TOP OF THE COMPUTATIONAL DOMAIN, not a claim about the market.
# The top row carries a Neumann dV/dv = 0 condition (vega has saturated up
# there), so a path that reaches the ceiling gets an approximation, not a wall.
# The only question that matters is how much that approximation moves the
# price, and that was measured rather than assumed.
#
# v_max = 0.64 is variance, so the ceiling is sqrt(0.64) = 80% ANNUALISED
# VOLATILITY — the highest VIX print in modern history (Oct 2008 and Mar 2020
# both peaked near 80). Nothing realistic is being cut off.
#
# What this calibration can actually reach. v_T has an exact non-central
# chi-square law (CIR); at T = 0.25y with v0 = theta = 0.04, kappa = 1.5,
# xi = 0.35 that gives E[v_T] = 0.04 (20% vol) and sd = 0.0294:
#     v_max   = vol    sigmas    P(v_T > v_max)
#      0.20    44.7%      5.4     3.6e-04   (1 in 2,800)
#      0.40    63.2%     12.3     5.0e-09   (1 in 200 million)
#      0.64    80.0%     20.4     2.2e-15
#      1.00   100.0%     32.7     1.9e-25
#
# What the truncation costs the price. Measured at ns = 421 with dv held
# FIXED at 0.002, so only the domain extends and resolution is unchanged:
#     v_max    nv    price          error vs v_max = 1.0
#      0.20   101    195.8875685    +1.19e-03
#      0.40   201    195.8868569    +4.82e-04
#      0.64   321    195.8865676    +1.93e-04     <- this config's ceiling
#      1.00   501    195.8863748     —
# For scale: that same grid's OWN discretisation error is 0.27 (195.887 vs
# the P4 Richardson estimate of 196.16). The domain truncation is three
# orders of magnitude below the error already in the answer.
#
# Stability arithmetic at 2048 x 512, v_max 0.64 (matches the solver's printed
# dt_stable, PLAN §1 — note term2 grows as v_max SHRINKS, because dv = v_max/511
# shrinks with it):
#     S-diffusion = v_max * (ns-1)^2      = 0.64 * 2047^2      = 2681734
#     v-diffusion = xi^2 * (nv-1)^2/v_max = 0.1225*511^2/0.64  =   49980
#     dt_stable   = 1 / (2681734 + 49980 + r)                  = 3.661e-7
#     dt          = 0.25 / 980000                              = 2.551e-7
#     ratio dt/dt_stable                                       = 0.697
# Runtime: ~40 min serial ON A LAPTOP CORE — never quotable next to cluster
# numbers. On r730-2 the derived figures are ~5.4 h baseline / ~2.1 h opt-L6
# (RESULTS.md §8, derived from measured throughput), and the video quotes
# only those, described as derivations (PRESENTATION.md §4).
#
# The grid stays 2048 x 512 exactly as the spec fixes it: two 8 MB buffers,
# comfortably larger than any per-core cache (PLAN §6's benchmarking rule that
# the problem must not fit in cache depends on this size).
#
# NOT node-aligned: ds = 21000/2047 puts spot 5200 at 506.9 cells and
# dv = 0.64/511 puts v0 = 0.04 at 31.9 cells, so the readout is bilinearly
# interpolated and the solver says so on stderr. That is correct behaviour,
# not a warning to silence — config/demo.cfg is the aligned grid.

option.strike         = 5250.0
option.maturity_years = 0.25
option.type           = call

market.spot      = 5200.0
market.rate      = 0.045
market.div_yield = 0.013

heston.v0    = 0.04
heston.kappa = 1.5
heston.theta = 0.04
heston.xi    = 0.35
heston.rho   = -0.70

grid.ns         = 2048
grid.nv         = 512
grid.nt         = 980000
grid.s_max_mult = 4.0
grid.v_max      = 0.64
